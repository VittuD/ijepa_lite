# @package _global_
#
# MI-rate 3-way masker experiment — directly comparable to the RD baseline
# (stl10_vits_ps8_rd.yaml).
#
# All training hyperparameters (lr, wd, schedule, batch, EMA) are
# intentionally identical to the RD experiment. The only differences are:
#
#   /masking/latent: rd_3way  →  mi_3way
#   /loss:           rd_3way  →  mi_3way
#
# Architecture context
# --------------------
# image_size=96, patch_size=8  →  grid = 12×12 = 144 patches (N)
# λ ~ LogUniform(0.005, 0.15)  →  MI-rate multiplier; capped so λ·log(3) ≲ recon_loss,
#                                  preventing the fixed-partition degenerate solution.
# α ~ LogUniform(0.05, 0.8)    →  surprise bonus weight (−α · surprise_soft)
# No external sharpener: the loss drives hardness. proj_score init std=0.02 ensures
# H(Y|X) gradient is non-zero from step 0 (breaks uniform fixed point).
#
# Masker transformer = Predictor transformer (depth=2, heads=6, dim=192).
# The masker sees all 144 EMA tokens (compressor=full) and produces a 3-way
# categorical assignment (ctx / tgt / ignore) for each patch.
#
# Objective
# ---------
#   total = reconstruction_loss
#         - α · surprise_soft          (Concrete relaxation, no REINFORCE)
#         + λ · mi_rate
#
#   surprise_soft = Σᵢ p_tgt_i · ||EMA_i − ctx_centroid||²
#   mi_rate       = H(Y|X) − H(Y)   (= −I(X;Y))
#   H(Y|X)        = mean per-patch categorical entropy   — minimised by decisive assignments
#   H(Y)          = entropy of mean class distribution   — maximised for class balance
#
# Key metrics (compare against stl10_vits_ps8_rd.yaml)
# -------------------------------------------------------
#   train/loss                  ← full MI-rate objective
#   train/reconstruction_loss   ← unweighted mean patch loss (direct baseline comparison)
#   mask/surprise_mean          ← soft-weighted surprise (masker's own signal)
#   mask/mi_rate                ← H(Y|X) − H(Y); should ↓ over training (I(X;Y) increasing)
#   mask/entropy_conditional    ← H(Y|X); healthy: ↓ toward 0
#   mask/entropy_marginal       ← H(Y);   healthy: stays near log(3) ≈ 1.1
#   mask/lambda                 ← λ sampled this step
#   mask/alpha                  ← α sampled this step
#   mask/expected_nctx          ← compare to baseline mask/nctx = 43
#   mask/expected_ntgt          ← compare to baseline mask/ntgt = 94
#   mask/expected_nign          ← ignored patches (should stay < 0.8·N)
#   mask/entropy_3way           ← per-patch assignment uncertainty; should decay
#   mask/batch_iou              ← collapse monitor; expected baseline ≈ 0.45
#   mask/floor_penalty          ← should be ~0 in healthy training; spikes = H(Y|X) below floor
#
# Ablation commands
# -----------------
# Disable MI-rate term (pure surprise + reconstruction):
#   python -m ijepa_lite.run experiment=stl10_vits_ps8_mi \
#       masking.latent.lam_max=1e-6 masking.latent.lam_min=1e-7
#
# Disable surprise bonus (MI-rate + recon only):
#   python -m ijepa_lite.run experiment=stl10_vits_ps8_mi \
#       masking.latent.alpha_max=1e-6 masking.latent.alpha_min=1e-7
#
# Smaller compressor (cut masker input from 144 to 36 tokens):
#   python -m ijepa_lite.run experiment=stl10_vits_ps8_mi \
#       masking/compressor=spatial_stride masking.compressor.stride=2
#
# Disable entropy floor (reproduce collapse dynamics):
#   python -m ijepa_lite.run experiment=stl10_vits_ps8_mi masking.latent.h_floor=0.0
#
# Disable λ warmup (immediate full range):
#   python -m ijepa_lite.run experiment=stl10_vits_ps8_mi masking.latent.lam_warmup_epochs=0

defaults:
  - /task: pretrain
  - /model: vit_torchvision
  - /predictor: base
  - /data: stl10
  - /masking: multiblock        # provides base config structure; name is ignored
                                # when masking.latent.name is set
  - /masking/compressor: full
  - /masking/latent: mi_3way
  - /loss: mi_3way
  - /optim: adamw
  - /sched: warmup_cosine
  - /train: pretrain
  - _self_

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12
  ema_momentum: [0.996, 1.0]

predictor:
  depth: 2
  num_heads: 6
  # predictor_dim=192, mlp_ratio=4.0, dropout=0.0 from /predictor: base.
  # Masker inherits these automatically via build.py — no duplication needed.

data:
  root: /scratch/ijepa_lite/data
  pretrain_split: unlabeled
  download: true
  batch_size: 512
  num_workers: 10
  prefetch_factor: 4

optim:
  lr: 6e-4
  weight_decay: 1e-5
  final_weight_decay: 1e-5
  betas: [0.9, 0.95]
  eps: 1e-8

sched:
  warmup_epochs: 4
  min_lr: 1e-6

train:
  epochs: 250
  amp: true
  grad_clip_norm: 1.0
  log_every: 50
  save_every_epochs: 10
