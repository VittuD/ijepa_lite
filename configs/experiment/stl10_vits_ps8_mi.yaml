# @package _global_
#
# MI-rate 3-way masker experiment — modular compositional loss.
#
# Architecture context
# --------------------
# image_size=96, patch_size=8  ->  grid = 12x12 = 144 patches (N)
# Masker transformer = Predictor transformer (depth=2, heads=6, dim=192).
# The masker sees all 144 EMA tokens (compressor=full) and produces a 3-way
# categorical assignment (ctx / tgt / ignore) for each patch.
#
# Loss terms (see masking/latent/mi_3way.yaml for default weights)
# ----------------------------------------------------------------
#   H_cond       : +H(Y|n)  — minimise conditional entropy (decisive assignments)
#   neg_H_marg   : -H(Y)    — maximise marginal entropy (role balance)
#   neg_surprise  : -surprise — maximise Bayesian surprise (content-adaptive signal)
#   floor_penalty : ReLU(h - H(Y|n))^2 — prevent entropy collapse
#
# Per-step term weights are sampled from LogUniform[lo, hi].
# [0, 0] disables a term; [x, x] fixes it.
#
# Key metrics
# -----------
#   train/loss                  <- full compositional objective
#   train/reconstruction_loss   <- unweighted mean patch loss
#   mask/surprise_mean          <- soft-weighted surprise
#   mask/mi_rate                <- H(Y|n) - H(Y); should decrease over training
#   mask/entropy_conditional    <- H(Y|n); healthy: decreases toward 0
#   mask/entropy_marginal       <- H(Y);   healthy: stays near log(3) ~ 1.1
#   mask/floor_penalty          <- should be ~0; spikes = H(Y|n) below floor
#   mask/weight/H_cond          <- sampled weight this step
#   mask/weight/neg_H_marg      <- sampled weight this step
#   mask/weight/neg_surprise    <- sampled weight this step
#
# Ablation commands
# -----------------
# Disable surprise term:
#   ... masking.latent.terms.neg_surprise.weight='[0,0]'
#
# Fixed H_cond weight (no LogUniform):
#   ... masking.latent.terms.H_cond.weight='[0.5,0.5]'
#
# Disable entropy floor (reproduce collapse dynamics):
#   ... masking.latent.terms.floor_penalty.weight='[0,0]'
#
# Enable ignore tax:
#   ... masking.latent.terms.ignore_tax.weight='[0.01,0.1]'

defaults:
  - /task: pretrain
  - /model: vit_torchvision
  - /predictor: base
  - /data: stl10
  - /masking: multiblock        # provides base config structure; name is ignored
                                # when masking.latent.name is set
  - /masking/compressor: full
  - /masking/latent: mi_3way
  - /loss: mi_3way
  - /optim: adamw
  - /sched: warmup_cosine
  - /train: pretrain
  - _self_

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12
  ema_momentum: [0.996, 1.0]

predictor:
  depth: 2
  num_heads: 6
  # predictor_dim=192, mlp_ratio=4.0, dropout=0.0 from /predictor: base.
  # Masker inherits these automatically via build.py — no duplication needed.

data:
  root: /scratch/ijepa_lite/data
  pretrain_split: unlabeled
  download: true
  batch_size: 512
  num_workers: 10
  prefetch_factor: 4

optim:
  lr: 6e-4
  weight_decay: 1e-5
  final_weight_decay: 1e-5
  betas: [0.9, 0.95]
  eps: 1e-8

sched:
  warmup_epochs: 10
  min_lr: 1e-6

train:
  epochs: 1000
  amp: true
  grad_clip_norm: 1.0
  log_every: 50
  save_every_epochs: 100
