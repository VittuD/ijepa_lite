# @package _global_
#
# Eval suite for the MI-rate 3-way coupled-SR pretrained model on STL-10.
#
# Runs all three eval modes in a single job:
#   linear_probe : SGD-trained linear head on frozen mean-pool features
#   masker_probe : learned (λ, α) through the frozen pretrained masker
#   logreg       : sklearn LogisticRegression on mean-pool features
#
# Usage:
#   PRETRAIN_CKPT=/path/to/last.pt python -m ijepa_lite.run \
#       experiment=stl10_eval_suite_coupled_sr
#
# Override individual modes:
#   python -m ijepa_lite.run experiment=stl10_eval_suite_coupled_sr \
#       task.eval_modes.linear_probe=false \
#       task.eval_modes.masker_probe=true \
#       task.eval_modes.logreg=true

defaults:
  - /task: eval_suite
  - /model: vit_torchvision
  - /predictor: base
  - /data: stl10
  - /masking: multiblock        # provides masking.* structure; name is ignored when latent is set
  - /masking/compressor: full   # needed so _build_latent_masker has compressor cfg
  - /masking/latent: mi_3way_coupled_sr
  - /loss: mi_3way              # needed so build.py can read loss.base_kind / loss.normalize
  - /train: eval_suite
  - _self_

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12

predictor:
  depth: 2
  num_heads: 6
  # predictor_dim=192, mlp_ratio=4.0, dropout=0.0 from /predictor: base.
  # Must match the pretrained masker architecture exactly.

data:
  root: ${oc.env:STL10_ROOT,/scratch/ijepa_lite/data}
  train_split: train
  val_split: test
  batch_size: 256
  num_workers: 4
  download: true

task:
  pretrained_ckpt: ${oc.env:PRETRAIN_CKPT,null}
  eval_modes:
    linear_probe: true
    masker_probe: true
    logreg: true
  masker_probe:
    lr: 1e-3
    rates_lr: 1e-2
    epochs: 20
    weight_decay: 0.0

train:
  epochs: 100
  lr: 0.1
  weight_decay: 0.0
