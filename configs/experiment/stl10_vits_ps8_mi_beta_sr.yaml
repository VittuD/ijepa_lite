# @package _global_
#
# MI-rate 3-way masker — Beta (s, r) scalarization variant.
#
# Directly comparable to stl10_vits_ps8_mi.yaml. The only difference is
# the masking/latent config: mi_3way_beta_sr uses beta_scalarization=true,
# replacing independent LogUniform sampling of (λ, α) with:
#
#   s ~ LogUniform(s_min=0.02, s_max=1.5)   [total regularisation strength]
#   r ~ Beta(2, 2)                           [MI vs. surprise allocation]
#   λ = s · r
#   α = s · (1 − r)
#
# Motivation
# ----------
# Independent LogUniform sampling spans an α/λ ratio range of ~5000×.
# The Beta(2,2) prior on r biases toward balanced configurations (r≈0.5 → λ≈α)
# while keeping the sampling open-loop and stable — no EMA feedback, no
# risk of objective-magnitude amplification.
#
# All other training hyperparameters are identical to the MI baseline.

defaults:
  - /task: pretrain
  - /model: vit_torchvision
  - /predictor: base
  - /data: stl10
  - /masking: multiblock
  - /masking/compressor: full
  - /masking/latent: mi_3way_beta_sr    # <-- only change vs. stl10_vits_ps8_mi.yaml
  - /loss: mi_3way
  - /optim: adamw
  - /sched: warmup_cosine
  - /train: pretrain
  - _self_

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12
  ema_momentum: [0.996, 1.0]

predictor:
  depth: 2
  num_heads: 6

data:
  root: /scratch/ijepa_lite/data
  pretrain_split: unlabeled
  download: true
  batch_size: 512
  num_workers: 10
  prefetch_factor: 4

optim:
  lr: 6e-4
  weight_decay: 1e-5
  final_weight_decay: 1e-5
  betas: [0.9, 0.95]
  eps: 1e-8

sched:
  warmup_epochs: 4
  min_lr: 1e-6

train:
  epochs: 250
  amp: true
  grad_clip_norm: 1.0
  log_every: 50
  save_every_epochs: 10
