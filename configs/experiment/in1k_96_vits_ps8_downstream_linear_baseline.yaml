# @package _global_
#
# True linear downstream probe for the IN1K 96x96 / ps8 vanilla-multiblock
# checkpoint. This is the no-hidden-layer baseline counterpart to the MLP
# downstream probe configs.

defaults:
  - /task: linear_probe
  - /model: vit_torchvision
  - /data: food101
  - /train: eval_linear
  - _self_

compile: true

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12

data:
  root: ${oc.env:FAST,/scratch}/datasets/
  batch_size: 256
  num_workers: 4
  download: false

task:
  head:
    type: linear
  sched:
    name: step
    step_size: 40
    gamma: 0.1
  pretrained_ckpt: ${oc.env:PRETRAIN_CKPT,null}

train:
  epochs: 100
  lr: 0.1
  weight_decay: 0.0
