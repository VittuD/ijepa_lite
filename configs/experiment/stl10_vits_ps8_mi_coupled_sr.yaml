# @package _global_
#
# MI-rate 3-way masker experiment — coupled (s, r) scalarization via logit-normal ratio.
#
# Identical to stl10_vits_ps8_mi.yaml except for the masking/latent config.
# λ = s·r, α = s·(1−r) where r = sigmoid(N(0, σ_r²)), s ~ LogUniform(s_min, s_max).
# This couples λ and α through a shared scale s, biasing toward balanced configurations
# while remaining open-loop (no EMA feedback).

defaults:
  - /task: pretrain
  - /model: vit_torchvision
  - /predictor: base
  - /data: stl10
  - /masking: multiblock        # provides base config structure; name is ignored
                                # when masking.latent.name is set
  - /masking/compressor: full
  - /masking/latent: mi_3way_coupled_sr
  - /loss: mi_3way
  - /optim: adamw
  - /sched: warmup_cosine
  - /train: pretrain
  - _self_

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12
  ema_momentum: [0.996, 1.0]

predictor:
  depth: 2
  num_heads: 6
  # predictor_dim=192, mlp_ratio=4.0, dropout=0.0 from /predictor: base.
  # Masker inherits these automatically via build.py — no duplication needed.

data:
  root: /scratch/ijepa_lite/data
  pretrain_split: unlabeled
  download: true
  batch_size: 512
  num_workers: 10
  prefetch_factor: 4

optim:
  lr: 6e-4
  weight_decay: 1e-5
  final_weight_decay: 1e-5
  betas: [0.9, 0.95]
  eps: 1e-8

sched:
  warmup_epochs: 4
  min_lr: 1e-6

train:
  epochs: 250
  amp: true
  grad_clip_norm: 1.0
  log_every: 50
  save_every_epochs: 10
