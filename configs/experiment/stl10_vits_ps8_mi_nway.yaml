# @package _global_
#
# N-way MI masker experiment — inter-target surprise, no ctx-vs-tgt terms.
#
# Architecture context
# --------------------
# image_size=96, patch_size=8  ->  grid = 12x12 = 144 patches (N)
# Masker transformer = Predictor transformer (depth=2, heads=6, dim=192).
# The masker produces a (M+2)-way categorical assignment
# (ctx / tgt₁ / ... / tgt_M / ign) for each patch, where M=4.
#
# Loss terms (see masking/latent/mi_nway.yaml for default weights)
# ----------------------------------------------------------------
#   nway_neg_H_marg      : -H(Y)    — maximise marginal entropy (role balance)
#   nway_cross_surprise   : -Σ_{k≠l} E_k[‖z − μ_l‖²]  — push target blocks apart
#   nway_floor_penalty    : ReLU(h - H(Y|n))^2 — prevent entropy collapse
#
# Per-step term weights are sampled from LogUniform[lo, hi].
# [0, 0] disables a term; [x, x] fixes it.

defaults:
  - /task: pretrain
  - /model: vit_torchvision
  - /predictor: base
  - /data: stl10
  - /masking: multiblock
  - /masking/compressor: full
  - /masking/latent: mi_nway
  - /loss: mi_nway
  - /optim: adamw
  - /sched: warmup_cosine
  - /train: pretrain
  - _self_

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12
  ema_momentum: [0.996, 1.0]

predictor:
  depth: 2
  num_heads: 6

data:
  root: /scratch/ijepa_lite/data
  pretrain_split: unlabeled
  download: true
  batch_size: 512
  num_workers: 10
  prefetch_factor: 4

optim:
  lr: 6e-4
  weight_decay: 1e-5
  final_weight_decay: 1e-5
  betas: [0.9, 0.95]
  eps: 1e-8

sched:
  warmup_epochs: 10
  min_lr: 1e-6

train:
  epochs: 1000
  amp: true
  grad_clip_norm: 1.0
  log_every: 50
  save_every_epochs: 100
