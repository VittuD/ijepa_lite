# @package _global_
#
# Geometry-configurable early-stopped downstream MLP probe.
# Override model.arch / image_size / patch_size / embed_dim / num_heads / depth
# from the launcher to match the pretrained encoder geometry.

defaults:
  - /task: linear_probe
  - /model: vit_torchvision
  - /data: food101
  - /train: eval_linear
  - _self_

compile: true

model:
  arch: vit_small
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12

data:
  root: ${oc.env:FAST,/scratch}/datasets/
  batch_size: 256
  num_workers: 4
  download: false

task:
  head:
    type: mlp
    hidden_dim: 192
    num_layers: 1
    dropout: 0.2
  sched:
    name: step
    step_size: 40
    gamma: 0.1
  pretrained_ckpt: ${oc.env:PRETRAIN_CKPT,null}

train:
  epochs: 100
  lr: 0.1
  weight_decay: 0.001
  early_stop_patience: 12
  early_stop_min_epochs: 20
  early_stop_min_delta: 0.0
