# @package _global_
#
# Geometry-configurable paper-style linear downstream probe.
# Override model.arch / image_size / patch_size / embed_dim / num_heads / depth
# from the launcher to match the pretrained encoder geometry.

defaults:
  - /task: linear_probe
  - /model: vit_torchvision
  - /data: food101
  - /train: eval_linear
  - _self_

compile: true

model:
  arch: vit_small
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12

data:
  root: ${oc.env:FAST,/scratch}/datasets/
  batch_size: 256
  num_workers: 4
  download: false

task:
  head:
    type: linear
  optim:
    name: lars
    momentum: 0.9
    eta: 1e-3
    eps: 1e-8
  sched:
    name: step
    step_size: 15
    gamma: 0.1
  pretrained_ckpt: ${oc.env:PRETRAIN_CKPT,null}

train:
  epochs: 50
  lr: 0.05
  weight_decay: 0.0
