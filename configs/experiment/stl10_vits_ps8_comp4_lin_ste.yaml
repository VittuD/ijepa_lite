# @package _global_
defaults:
  - /task: pretrain
  - /model: vit_torchvision
  - /predictor: base
  - /data: stl10
  - /masking: block
  - /loss: vanilla
  - /optim: adamw
  - /sched: warmup_cosine
  - /train: pretrain
  - _self_

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12
  ema_momentum: [0.996, 1.0]

predictor:
  depth: 2
  num_heads: 6

masking:
  spatial: block               # collate-side: what shape/how many patches
  target: ste_linear           # model-side: how target positions are chosen
  target_ratio: 0.65
  context_ratio: 0.30
  block_area_ratio: [0.10, 0.35]
  lm_loss_weight: 0.1
  lm_lr: 1.0e-4

data:
  root: /scratch/ijepa_lite/data
  pretrain_split: unlabeled
  download: true
  batch_size: 512
  num_workers: 10
  prefetch_factor: 4

loss:
  kind: smooth_l1

optim:
  lr: 6e-4
  weight_decay: 1e-5
  final_weight_decay: 1e-5
  betas: [0.9, 0.95]
  eps: 1e-8

sched:
  warmup_epochs: 4
  min_lr: 1e-6

train:
  epochs: 400
  amp: true
  grad_clip_norm: 1.0
  log_every: 50
  save_every_epochs: 10