# @package _global_
#
# VOC semantic-segmentation probe for the IN1K 96x96 / ps8 vanilla-multiblock
# checkpoint. Uses the same frozen-encoder MLP head shape as the downstream
# classification probe, applied independently to each patch token.

defaults:
  - /task: segmentation_probe
  - /model: vit_torchvision
  - /data: vocseg
  - /train: eval_linear
  - _self_

compile: true

model:
  arch: vit_small_16
  image_size: 96
  patch_size: 8
  embed_dim: 384
  num_heads: 6
  depth: 12

data:
  root: ${oc.env:FAST,/scratch}/datasets/
  batch_size: 128
  num_workers: 4
  download: false

task:
  head:
    type: mlp
    hidden_dim: 384
    num_layers: 1
  sched:
    name: step
    step_size: 40
    gamma: 0.1
  pretrained_ckpt: ${oc.env:PRETRAIN_CKPT,null}
  ignore_index: 255

train:
  epochs: 100
  lr: 0.1
  weight_decay: 0.0
