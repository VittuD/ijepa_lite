epochs: 100
amp: true
grad_clip_norm: 1.0
log_every: 50
save_every_epochs: 100
eval_every_epochs: 100
keep_all_checkpoints: true
viz_enabled: true

inline_eval:
  dataset: stl10
  data_root: ${oc.env:FAST,/scratch}/datasets/
  train_split: train
  val_split: test
  num_classes: 10
  batch_size: 2048
  num_workers: 4
  head_type: mlp
  head_hidden_dim: 384
  head_num_layers: 1
  probe_epochs: 100
  probe_lr: 0.1
  probe_weight_decay: 0.0
  probe_sched: step
  probe_step_size: 30
  probe_gamma: 0.1

viz:
  n_images: 100
  out_dir: viz_output
  data_root: ${oc.env:FAST,/scratch}/datasets/
  dataset: stl10
  grid_cols: 10
  k_tgt: null
