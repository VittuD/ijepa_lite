name: chestmnist
root: data

train_split: train
val_split: val
pretrain_split: all

size: 224
as_rgb: true
download: false
mmap_mode: null
task_type: multilabel

class_names:
  - atelectasis
  - cardiomegaly
  - effusion
  - infiltration
  - mass
  - nodule
  - pneumonia
  - pneumothorax
  - consolidation
  - edema
  - emphysema
  - fibrosis
  - pleural
  - hernia

batch_size: 256
num_workers: 4
pin_memory: true
prefetch_factor: 2
persistent_workers: true
