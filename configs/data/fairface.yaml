name: fairface
root: data

backend: hf
hf_repo_id: HuggingFaceM4/FairFace
hf_local_dir: ${.root}/fairface_hf
hf_subset: "0.25"
hf_image_field: image

train_split: train
val_split: validation

target_attr: race
# Default path assumes a local Hugging Face dataset snapshot under the shared
# dataset root, e.g. data/fairface_hf/ copied over from a local machine.
image_dirname: fairface-img-margin025-trainval
train_csv: fairface_label_train.csv
val_csv: fairface_label_val.csv
csv_dir: null
image_root: null
download: false

batch_size: 256
num_workers: 4
pin_memory: true
prefetch_factor: 2
persistent_workers: true
