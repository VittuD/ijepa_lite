name: organmnist
root: data

train_split: train
val_split: val

size: 128
as_rgb: true
download: false
mmap_mode: null

class_names:
  - bladder
  - femur-left
  - femur-right
  - heart
  - kidney-left
  - kidney-right
  - liver
  - lung-left
  - lung-right
  - pancreas
  - spleen

batch_size: 256
num_workers: 4
pin_memory: true
prefetch_factor: 2
persistent_workers: true
