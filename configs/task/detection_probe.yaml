name: detection_probe

# Path to a pretraining checkpoint produced by this repo or original I-JEPA weights.
pretrained_ckpt: null

# Which encoder weights to use from the checkpoint.
encoder: auto

# Dense token feature mode:
# - mean: final-layer patch tokens, shape [B, N, D]
# - last4_mean: concatenate last-4 layer patch tokens, shape [B, N, 4D]
pool: mean

amp: true
metric: map

# One-anchor-per-patch assignment. positive_radius=0 assigns only the GT center cell.
positive_radius: 0

# Loss.
objectness_loss: focal
focal_alpha: 0.25
focal_gamma: 2.0
obj_weight: 1.0
box_weight: 5.0
max_box_size: 1.0

# Evaluation.
ap_iou_threshold: 0.5
map_iou_thresholds: [0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75]
score_threshold: 0.05
objectness_recall_threshold: 0.05
nms_iou_threshold: 0.5
max_detections: 100
froc_fp_per_image: [0.5, 1.0, 2.0, 4.0]
