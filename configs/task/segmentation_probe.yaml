name: segmentation_probe

# Path to a pretraining checkpoint produced by this repo (checkpoints/last.pt in rank0 dir)
pretrained_ckpt: null

# Which encoder weights to use from the pretrain checkpoint
# - auto: prefer EMA target for vanilla checkpoints, otherwise fall back to the
#   shared/context encoder path used by SIGReg checkpoints
# - context: online/shared encoder
# - target: EMA encoder when present
# - shared: alias for the shared/context encoder path
encoder: auto

# Dense token feature mode
# - mean: final-layer patch tokens, shape [B, N, D]
# - last4_mean: concatenate last-4 layer patch tokens, shape [B, N, 4D]
pool: mean

amp: true
ignore_index: 255
metric: miou
foreground_class: 1
