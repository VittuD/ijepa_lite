name: eval_suite

# Path to a pretraining checkpoint produced by this repo (checkpoints/last.pt in rank0 dir)
pretrained_ckpt: null

# Which encoder weights to use from the JEPA checkpoint
# - context: online encoder
# - target: EMA encoder
encoder: target

# Feature pooling from patch tokens (used by the linear_probe mode)
pool: mean
amp: true

# Toggle each eval mode independently
eval_modes:
  linear_probe: true        # SGD linear head (always on by default)
  masker_probe: false       # soft-pool via frozen masker; learnable (λ, α)
  logreg: false             # sklearn LogisticRegression on mean-pool features
  masker_hard_probe: false  # linear head on hard-selected context tokens; fixed (λ, α)

# Per-mode overrides (only used when the corresponding mode is enabled)
masker_probe:
  lr: 1e-3
  rates_lr: 1e-2
  epochs: 100
  weight_decay: 0.0

logreg:
  max_iter: 2000
  C: 1.0

masker_hard_probe:
  lam: 0.1    # fixed λ — override with task.masker_hard_probe.lam=<value>
  alpha: 0.07 # fixed α — override with task.masker_hard_probe.alpha=<value>
  # Which token bins to pool. Any '+'-separated combination of: ctx, tgt, ign
  # Examples: ctx | tgt | ign | ctx+tgt | ctx+tgt+ign
  pool: ctx
