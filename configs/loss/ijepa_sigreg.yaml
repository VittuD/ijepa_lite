# @package loss
#
# JEPA token prediction with SIGReg regularization on full-view patch tokens.

kind: smooth_l1
normalize: false

sigreg:
  enabled: true
  weight: 0.05
  num_slices: 512
  num_t: 16
  t_max: 4.0
  standardize: false
  eps: 1e-6
  projection_seed: 0
  use_projector: false
  projector_hidden_dim: 2048
  projector_output_dim: 512
