# @package loss
#
# Rate-distortion 3-way loss configuration.
#
# How it maps to code
# -------------------
# `kind: rd_3way` is the sentinel that tells build.py to wire up the
# RateDist3WayMasker's owns_loss path rather than passing a plain scalar loss
# through the standard reconstruction channel.
#
# ijepa.py uses VanillaTokenLoss(kind=base_kind, normalize=normalize) to
# produce a scalar reconstruction_loss, which is passed into
# RateDist3WayMasker.aux_loss().  The masker then computes the full objective:
#
#   total = reconstruction_loss
#         - α · surprise_soft          (Concrete, fully differentiable)
#         + β · ign_tax
#         + λ · N · R
#
#   surprise_soft = Σᵢ p_tgt_i · ||EMA_i − ctx_centroid||²
#   ign_tax       = Σᵢ p_ign_i · ||EMA_i − image_mean||²
#   ctx_centroid  = (Σᵢ p_ctx_i · EMA_i) / max(Σᵢ p_ctx_i, 1)
#   R             = (1/N) Σᵢ p_ctx_i
#
# (λ, α, β) are sampled from LogUniform each batch during pre-training,
# so the masker learns a 3-D R-D surface.
#
# Logged as:
#   train/loss                ← total (full RD objective)
#   train/reconstruction_loss ← unweighted mean patch loss (monitoring only)
#   mask/surprise_mean        ← soft-weighted surprise
#   mask/ign_rate             ← ignore tax value
#   mask/rate                 ← R ∈ [0, 1]
#   mask/lambda               ← λ sampled this step
#   mask/alpha                ← α sampled this step
#   mask/beta                 ← β sampled this step

kind: rd_3way

# Per-patch distortion function used by ijepa.py before soft-weighting.
# Must match the kind in the comparable vanilla experiment (smooth_l1 here).
base_kind: smooth_l1

# Whether to L2-normalise pred and target before computing the distortion.
# False matches the i-JEPA paper default.
normalize: false
