# @package masking.latent
name: mi_3way

terms:
  H_cond:
    weight: [0.01, 1.0]
  neg_H_marg:
    weight: [0.01, 1.0]
  neg_surprise:
    weight: [0.01, 0.5]
  neg_symmetric_cos_surprise:
    weight: [0, 0]
    role_indices: [0, 1]  # ctx, tgt; set [0, 1, 2] to include ign
  neg_sketched_orthogonal_cos_surprise:
    weight: [0, 0]
    num_sketches: 8
    assign_tau: 0.25
    eps: 1.0e-6
    sketch_seed: 0
    detach_assignments: true
  neg_prompt_contrast:
    weight: [0, 0]
    sample_mode: uniform_distinct  # "uniform_distinct" or "feature_far"
    sample_temperature: 0.5
    exclude_prompts: true
    degenerate_cos_threshold: 0.9
    eps: 1.0e-8
  neg_logdet_diversity:
    weight: [0, 0]
    role_indices: [0, 1]  # ctx, tgt
    sketch_dim: 32
    alpha: 1.0
    eps: 1.0e-6
    projection_seed: 0
  neg_support_logdet_diversity:
    weight: [0, 0]
    role_indices: [0, 1]  # ctx, tgt
    sketch_dim: 32
    alpha: 1.0
    eps: 1.0e-6
    projection_seed: 0
    support_power: 0.5
  neg_signed_support_logdet:
    weight: [0, 0]
    diverse_role_indices: [0, 1]  # ctx, tgt
    compact_role_indices: [2]     # ign
    compact_weight: 1.0
    sketch_dim: 32
    alpha: 1.0
    eps: 1.0e-6
    projection_seed: 0
    support_power: 0.5
  neg_mass_logdet_diversity:
    weight: [0, 0]
    role_indices: [0, 1]  # ctx, tgt
    sketch_dim: 32
    alpha: 1.0
    eps: 1.0e-6
    projection_seed: 0
  neg_centroid_dist:
    weight: [0, 0]
  floor_penalty:
    weight: [5.0, 5.0]
    h_floor: 0.1
  ignore_tax:
    weight: [0, 0]
  context_rate:
    weight: [0, 0]
  target_rate:
    weight: [0, 0]
  neg_affinity_novelty:
    weight: [0, 0]
    alpha: 4.0
    w_tgt: 1.0
    gamma: [0.5, 0.5]  # scalar or [start, end]; equal endpoints collapse to constant
    gamma_schedule: constant  # constant | linear | cosine
    sketch_dim: 64
    eps: 1.0e-4
    sigma_rho: [1.0, 1.0]  # [start, end]; equal endpoints collapse to constant
    sigma_rho_schedule: constant  # constant | linear | cosine
    sigma_floor: 1.0e-6
    sketch_seed: 0
    norm_eps: 1.0e-8
    eff_rank_every_steps: 50
  neg_hybrid_affinity_novelty:
    weight: [0, 0]
    alpha: 4.0
    w_tgt: 1.0
    gamma: [0.5, 0.5]
    gamma_schedule: constant
    sketch_dim: 64
    eps: 1.0e-4
    sigma_rho: [1.0, 1.0]
    sigma_rho_schedule: constant
    sigma_floor: 1.0e-6
    sigma_pos: [2.0, 2.0]         # [start, end] spatial bandwidth in patch-width units; anneal large→small
    sigma_pos_schedule: constant  # constant | linear | cosine
    sketch_seed: 0
    norm_eps: 1.0e-8
    eff_rank_every_steps: 50
  neg_predictability:
    weight: [0, 0]
    sketch_dim: 64
    sigma_rho: 1.0        # scalar (no schedule); RBF sharpness, like affinity-novelty
    sigma_floor: 1.0e-6
    eps: 1.0e-4
    sketch_seed: 0
    norm_eps: 1.0e-8
    residualize: true     # subtract per-position batch-mean difficulty (image-specific surprise + ctx-collapse guard)
    standardize: true     # per-image RMS-normalize the difficulty -> loss weight is a transferable O(1) std-threshold
    reward_norm: all      # "all" = Σ p_tgt·diff / N (targets = hard REGION); "targets" = / Σ p_tgt (DEGENERATE: ntgt→1)

warmup_epochs: 0
warmup_use_vanilla_multiblock: false
warmup_train_masker_on_soft_assignments: false
ntgt_min: 4
nctx_min: 1
max_total_hard: 0      # 0 = disabled; otherwise cap nctx + ntgt predictor tokens
hard_assignment: topk    # "topk", "argmax", "gumbel", "random_region_growth", or "random_region_growth_multiblock"
gumbel_tau: 1.0          # temperature for gumbel hard assignment
rrg_keep_percent: 50     # only used by random-region-growth hard assignments
rrg_num_target_blocks: 4 # only used when hard_assignment=random_region_growth_multiblock
rrg_keep_k_per_block: 0  # 0 = disabled; otherwise fixed per-block target budget for learned multiblock RRG
