# @package masking.latent
name: mi_nway

num_tgt_blocks: 4
ntgt_min_per_block: 4
nctx_min: 1
hard_assignment: topk    # "topk" (fixed K per block) or "argmax" (each patch → its most probable role)
arch: transformer        # "transformer", "mlp", or "linear"

terms:
  nway_neg_H_marg:
    weight: [1.0, 1.0]
  nway_cross_surprise:
    weight: [0.04, 0.04]
  nway_floor_penalty:
    weight: [5.0, 5.0]
    h_floor: 0.16

warmup_epochs: 0
