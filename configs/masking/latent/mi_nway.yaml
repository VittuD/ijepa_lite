# @package masking.latent
name: mi_nway

num_tgt_blocks: 4
ntgt_min_per_block: 4
max_total_tgt: 0        # 0 = disabled; otherwise cap the sum across target blocks
max_tgt_per_block: 0    # 0 = disabled; otherwise cap any single target block
nctx_min: 1
hard_assignment: topk    # "topk", "argmax", or "gumbel" (sample from learned distribution)
arch: transformer        # "transformer", "mlp", or "linear"
gumbel_tau: 1.0          # temperature for gumbel sampling (only used when hard_assignment=gumbel)

terms:
  nway_neg_H_marg:
    weight: [1.0, 1.0]
  nway_cross_surprise:
    weight: [0.04, 0.04]
  neg_logdet_diversity:
    weight: [0, 0]
    role_indices: [0, 1]  # ctx, tgt_0
    sketch_dim: 32
    alpha: 1.0
    eps: 1.0e-6
    projection_seed: 0
  neg_support_logdet_diversity:
    weight: [0, 0]
    role_indices: [0, 1]  # ctx, tgt_0
    sketch_dim: 32
    alpha: 1.0
    eps: 1.0e-6
    projection_seed: 0
    support_power: 0.5
  nway_floor_penalty:
    weight: [5.0, 5.0]
    h_floor: 0.16

warmup_epochs: 0

# k schedule (context mass fraction for KL marginal term)
# All at 0.0 = disabled (no k conditioning, use nway_neg_H_marg instead)
# Schedule: k_start -> k_max (warmup) -> k_min (cosine annealing)
k_start: 0.0
k_min: 0.0
k_max: 0.0
k_warmup_epochs: 10
