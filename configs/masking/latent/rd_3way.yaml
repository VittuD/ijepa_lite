# @package masking.latent
name: rd_3way

# Gumbel temperature for the 3-way categorical (ctx / tgt / ignore).
temperature: 1.0

# λ distribution: LogUniform(lam_min, lam_max), sampled once per batch.
# λ ≈ "cost per context token" in units of reconstruction_loss.
# With smooth_l1 and N=144: λ=0.001 → rate penalty ≈ 0.14 at R=1 (cheap);
# λ=1.0 → rate penalty ≈ 144 at R=1 (very expensive). Start conservative.
lam_min: 0.001
lam_max: 1.0

# α distribution: LogUniform(alpha_min, alpha_max), sampled once per batch.
# α ≈ weight on the surprise bonus (−α · surprise_soft).
alpha_min: 0.01
alpha_max: 0.5

# β distribution: LogUniform(beta_min, beta_max), sampled once per batch.
# β ≈ weight on the ignore tax (+β · ign_tax).
beta_min: 0.01
beta_max: 0.5

# Hard floor on target count — prevents D→0 collapse.
# ntgt = max(ntgt_min, round(mean_batch(Σᵢ p_tgt_i)))
ntgt_min: 4

# Transformer capacity: predictor_dim, depth, num_heads, mlp_ratio, dropout
# pulled from cfg.predictor automatically. Override deliberately if needed:
#   masking.latent.depth: 4
