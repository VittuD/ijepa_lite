# @package masking.latent
#
# Beta (s, r) scalarization variant of the MI-rate 3-way masker.
#
# Sampling change vs. mi_3way.yaml
# ----------------------------------
# Decouples total regularisation strength (s) from the MI/surprise trade-off
# direction (r), and biases r toward balanced configurations using Beta(a, a)
# instead of the implicit Uniform that independent LogUniform produces.
#
#   s ~ LogUniform(s_min, s_max)    [total strength, same warmup as λ]
#   r ~ Beta(a, a)                  [allocation ratio; a=2 concentrates near 0.5]
#   λ = s · r
#   α = s · (1 − r)
#
# Key difference from mi_3way_normsca.yaml
# -----------------------------------------
# No EMA normalisation — λ and α are raw (s, r) products.
# This avoids the inverse-feedback instability where improving MI shrank
# EMA(|mi_rate|) and inflated λ_eff, destabilising training.
# Both terms always have a positive lower bound (s_min * r_min > 0).
#
# beta_concentration controls how tightly r clusters around 0.5:
#   Beta(2,2):  mild bias — 5th/95th pct ≈ [0.09, 0.91]
#   Beta(4,4):  moderate — 5th/95th pct ≈ [0.19, 0.81]
#   Beta(8,8):  strong   — 5th/95th pct ≈ [0.27, 0.73]
name: mi_3way

lam_min: 0.01
lam_max: 1.0
alpha_min: 0.01
alpha_max: 0.5
ntgt_min: 4
nctx_min: 1
h_floor: 0.1
floor_weight: 5.0
lam_warmup_epochs: 0

# (s, r) bounds — span same overall range as lam + alpha.
s_min: 0.02
s_max: 1.5

# Beta(a, a) concentration for r.
beta_scalarization: true
beta_concentration: 2.0
