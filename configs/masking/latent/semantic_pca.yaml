# @package masking.latent
name: semantic_pca

# PC1 is used as the per-image semantic coordinate.
pca_dim: 1

# Number of batched power-iteration steps used to approximate PC1.
power_iterations: 4

# "band": choose a contiguous quantile band along a random PCA direction.
# "side": choose one high/low quantile side along a random PCA direction.
split_mode: band

# "complement": context is the non-target side up to context_ratio.
# "balanced": context is evenly spread over the non-target PCA ordering.
context_mode: complement

# L2-normalize centered token vectors before PCA. This makes PCA less dominated
# by token norm and more by angular token geometry.
normalize_tokens: true

eps: 1.0e-6
