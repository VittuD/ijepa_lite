# @package masking.latent
name: goldilocks

# Target budget — LogUniform(k_tgt_min, k_tgt_max)
# For STL-10 ViT-S/8: N=144 patches
k_tgt_min: 4    # ~3%  of patches
k_tgt_max: 72   # ~50% of patches

# Context budget — Uniform(k_ctx_min, k_ctx_max), contiguous rectangle
k_ctx_min: 32   # ~22% of patches
k_ctx_max: 96   # ~67% of patches

# Goldilocks loss weight
beta: 1.0

# Z-score denominator floor (prevents division by zero on uniform-loss batches)
z_score_eps: 1e-6

# NOTE: global_z_score=false uses per-K z-scoring which has a known degenerate
# fixed point (sigma->0 -> all targets->1 -> positional collapse ~halfway through
# training). Set to true to z-score against the running training distribution.
global_z_score: false

# Log-transform patch losses before z-scoring to reduce skewness.
# Raw errors are heavily right-skewed (skew~5); log reduces to ~0.6,
# making the Gaussian target penalise both tails meaningfully.
log_transform: false

# Use Pearson correlation instead of MSE for the Goldilocks loss.
# Invariant to score mean/scale — prevents score suppression when
# log_transform=true makes the target mean drop below typical sigmoid output.
correlation_loss: false
